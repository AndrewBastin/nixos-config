[package]
name = "andrew-bar"
version = "0.1.0"
edition = "2024"

[dependencies]
rune = { path = "../vendor/rune", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
system-tray = "0.8"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
libc = "0.2"
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }
futures-util = "0.3"
