[package]
name = "andrew-bar"
version = "0.1.0"
edition = "2024"

[dependencies]
rune = { path = "../vendor/rune", default-features = false, features = ["svg", "dbus"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
system-tray = "0.8"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
libc = "0.2"
skrifa = "0.44"
# Both already built for Rune's dbus feature.
zbus = { version = "6", default-features = false, features = ["tokio"] }
futures-util = "0.3"
